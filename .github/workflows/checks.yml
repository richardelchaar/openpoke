name: checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest
      # No model calls and no API key in any of these.
      - name: Unit tests
        run: python -m pytest tests -q
      - name: The worlds and cases are the ones that were frozen
        run: sha256sum -c evals/CHECKSUMS
      - name: Every case is consistent with its world
        run: python -m evals.cases.validate
      - name: The grader gives the reference strategies the scores they should get
        run: python -m evals.references dev
